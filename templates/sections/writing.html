<section id="writing" class="section writing-section">
  <h2>Writing</h2>

  <div class="writing-list">
    {% for post in writing_posts %}
    <article class="writing-card {% if loop.first %}writing-featured{% else %}writing-secondary{% endif %}">
      <div class="writing-body">
        {% if post.date %}
        <p class="writing-meta">{{ post.date }}</p>
        {% endif %}

        <h3 class="writing-title">{{ post.title }}</h3>

        {% if post.short_summary %}
        <p class="writing-summary">{{ post.short_summary }}</p>
        {% endif %}

        {% if post.post_url %}
        <div class="writing-links">
          <a href="{{ post.post_url }}" target="_blank" rel="noopener">
            {% if loop.first %}Read Paper{% else %}Read Post{% endif %}
          </a>
        </div>
        {% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
</section>
