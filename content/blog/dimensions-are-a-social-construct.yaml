content: |
  This post originally appeared on my old blog and includes images, references, and formatting from that page. I am keeping the full version there rather than recreating it here.

  It is an early piece, but it captures a thread I still care about: using writing to take an abstract scientific idea, overthink it, and eventually turn it into a question about how people create meaning.
