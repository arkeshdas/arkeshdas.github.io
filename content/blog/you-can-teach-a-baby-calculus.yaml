content: |
  <p>You can teach a baby calculus<br>
  but first you must teach him precalculus</p>

  <p>If you want to teach a baby precalculus<br>
  you must first teach him functions</p>

  <p>If you want to teach a baby functions<br>
  you must first teach him algebra</p>

  <p>If you want to teach a baby algebra<br>
  you must first teach him arithmetic</p>

  <p>But by the time you’ve taught him all that<br>
  he isn’t a baby anymore</p>

  <p>You could wait until he is a man<br>
  to teach him arithmetic</p>

  <p>But then you must wait until he has learned arithmetic<br>
  to teach him algebra</p>

  <p>And if you must wait until he has learned algebra<br>
  you must wait to teach him functions</p>

  <p>And if you must wait until he has learned functions<br>
  you must wait to teach him precalculus</p>

  <p>And if you must wait until he has learned precalculus<br>
  you must wait to teach him calculus</p>

  <p>But by the time he has learned calculus<br>
  he has a baby of his own<br>
  still waiting to learn arithmetic</p>

  <p>And you can teach a baby calculus<br>
  but first you must teach him precalculus</p>
