    category: "Education"
    title: "Doctor of Medicine"
    organization: "University of Toledo College of Medicine and Life Sciences"
    description: |
      Incoming M1 through the MedStart program. Participating in the M-Zero Data Science Pre-Matriculation Program before beginning medical school.

  - date: "May-Aug 2025"
    category: "Clinical"
    title: "Medical Assistant"
    organization: "Jagannathan Neurosurgery"
    description: |
      Supported daily clinic operations, including patient intake, rooming, vitals, procedure preparation, and patient flow for a high-volume neurosurgery practice.

      Charted vitals, prepared patients for in-office procedures, coordinated follow-ups, referrals, and imaging, and communicated with outside offices to close loops. Served as medical records custodian, processed records requests under HIPAA, maintained audit logs, and worked extensively in the EMR.

  - date: "Jun-Aug 2025"
    category: "Mentorship"
    title: "Day Camp Counselor"
    organization: "City of Troy"
    description: |
      Worked with children in a summer day camp setting, supporting daily activities, supervision, and outdoor programming.

  - date: "Apr-Jun 2025"
    category: "Work"
    title: "Merchandiser"
    organization: "Green Circle Growers"
    description: |
      Restocked plant displays, supported retail presentation, and got good at identifying a bunch of plants.
  - date: "Apr 2023-Apr 2025"
    category: "Scholarship"
    title: "Dean's Research Scholar"
    organization: "Michigan State University College of Natural Science"
    description: |
      Selected as one of ten students to represent the College of Natural Science at alumni engagements and university-affiliated events.

      Trained to communicate research experiences to general audiences, including independent psychology research in the Cesario Lab and collaborative plant biotechnology work in the Hamberger Lab.

  - date: "Apr 13, 2024"
    category: "Poster"
    title: "Characterizing Promoters for Terpene Production in Sorghum"
    organization: "Hamberger Lab, Michigan State University"
    description: |
      Designed and presented a research poster for work under Angel McKay Whiteman in the Hamberger Lab, led by PI Bjorn Hamberger.

      The project characterized promoter candidates and transient expression methods for targeting gene expression to the sorghum epidermis or cuticle, with potential applications in terpene production, synthetic biology, and bioenergy crop development.

      [View poster](../pdf/sorghum-poster.pdf)

  - date: "Aug 2024-May 2026"
    category: "Leadership"
    title: "Undergraduate Research Ambassador"
    organization: "Michigan State University Department of Undergraduate Research"
    description: |
      Mentored undergraduate students on how to get involved in research through one-on-one peer advising, cold-email support, and opportunity matching based on student interests.

      Presented at research panels and workshops focused on helping students secure and succeed in research positions. Created outreach content that won a most engaging social media post award and reached more than 20,000 impressions across platforms.

  - date: "Dec 2023-Apr 2025"
    category: "Research"
    title: "Independent Researcher"
    organization: "Cesario Lab, Michigan State University"
    description: |
      Conducted independent research on Bayesian conditional probabilities and their role in modeling stereotypes, focusing on how a trait's diagnostic ratio relates to its categorization as a stereotype, counterstereotype, or non-stereotype for a social group.

      Completed proposal approval, preliminary data collection, and analysis using R and Python.

  - date: "Aug 2023-May 2025"
    category: "Research"
    title: "Undergraduate Research Assistant"
    organization: "Hamberger Lab, Michigan State University"
    description: |
      Characterized regulatory elements that target gene expression to the epidermis or cuticle of sorghum using transient expression.

      Supported work intended to target terpene production to the epidermis or thick hydrophobic cuticle of sorghum, improving ease of extraction and purification. Gained experience with DNA/RNA extraction and purification, PCR, genetic marker analysis, experimental trials, and data analysis.

  - date: "May 2024-2025"
    category: "Service"
    title: "Patient Concierge"
    organization: "University of Michigan Sparrow Hospital"
    description: |
      Provided companionship and emotional support to patients in cardiac step-down units, especially for patients with limited visitors.

      Acted as a liaison between patients and nursing staff by addressing patient needs, answering questions, and supporting comfort during staffing shortages.

  - date: "Aug 2023-May 2026"
    category: "Education"
    title: "B.S. Data Science; Biochemistry and Molecular Biology/Biotechnology"
    organization: "Michigan State University"
    description: |
      Honors College student graduating with 180 credits and a 4.0 GPA. Activities included Phi Delta Epsilon Medical Fraternity, Honors Times Two, Club Swimming, and the Professorial Assistantship Program.

      Coursework emphasized data science, statistics, computational modeling, bioinformatics, biochemistry, molecular biology, plant genetics, and biotechnology.

