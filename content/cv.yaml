      Mentored gifted K-5 students in the greater East Lansing area on extracurricular STEM-based projects.

      Supported lesson development, event planning, team collaboration, budgeting, troubleshooting, and student engagement, culminating in collaborative project presentations for families and peers.

  - date: "2024-2025"
